[package]
name = "gray-archify"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
description = "Repo architecture visualizer: archify emits a self-contained interactive HTML module map; archify_prompt returns a markdown outline"

[[bin]]
name = "gray-archify"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[profile.release]
strip = true
